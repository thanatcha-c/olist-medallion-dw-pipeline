version: 2

models:
  - name: fct_order_payments
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
                - order_id
                - payment_seq
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: payment_seq
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
      - name: installments
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: payment_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

