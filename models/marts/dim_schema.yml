version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests: 
          - not_null
      - name: state
        tests:
          - not_null

  - name: dim_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: state
        tests:
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: weight_g
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false   
      - name: length_cm
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: height_cm
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: width_cm
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

